name: pamav

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI (PHP + Frontend)
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- PHP / backend ----------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # matches composer.json (^8.3)
          extensions: mbstring, xml, ctype, json, tokenizer, bcmath, curl, pdo_sqlite, sqlite3, dom, fileinfo
          coverage: none
          tools: composer:v2

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      # ---------- Node / frontend ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*' # matches .nvmrc
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run backend tests
        run: php artisan test

  # ---------- CD: auto pull + build sa Ubuntu server ----------
  deploy:
    name: Deploy to Ubuntu server
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false # hintayin ang tumatakbong deploy, huwag i-cancel sa gitna

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.SERVER_APP_PATH || '/var/www/pamav' }}

            git fetch --all --prune
            git pull --ff-only origin main

            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            npm ci
            npm run build

            php artisan migrate --force
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan optimize

            sudo systemctl reload php8.3-fpm nginx
